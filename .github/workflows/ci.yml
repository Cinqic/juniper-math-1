name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  foundation-checks:
    runs-on: ubuntu-latest
    # CPU-only. CUDA-specific checks are not part of CI and remain local to
    # the RTX 2060 target hardware (see docs/ENVIRONMENT.md).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Must match pyproject.toml's requires-python. The project declares
          # exactly the interpreter it tests — see reports/OPUS5_PHASE0_REVIEW.md
          # NOTE-A (3.10/3.11 were previously declared but never exercised).
          python-version: "3.12"

      - name: Install exact validated environment (lock)
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Unit tests
        run: pytest -v

      - name: Validate configuration
        run: python -m juniper_math validate-config

      - name: Validate evaluation suite
        run: python -m juniper_math evals validate

      - name: Validate manifests
        run: python -m juniper_math manifests-validate

      - name: Dependency/license cross-check
        run: python -m juniper_math deps-check

      - name: Verify evaluation ground truth
        run: python -m juniper_math evals verify

      - name: Verify artifact hashes
        run: python -m juniper_math hash verify

      - name: Construct model and verify exact parameter count (CPU)
        run: python -m juniper_math model --device cpu

      - name: Tiny controlled overfit (CPU, architecture validation only)
        run: python scripts/tiny_overfit.py --device cpu --steps 150

      - name: Environment report (informational; CUDA WARNING expected on CI)
        run: python -m juniper_math validate-env || true
