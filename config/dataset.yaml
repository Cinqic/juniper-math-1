# Juniper Math 1 — canonical Phase 4 dataset configuration.
#
# This file is the single source of truth for dataset identity, exactly as
# config/tokenizer.yaml is for the tokenizer and config/tools.yaml is for the
# tool protocol. Nothing here is duplicated as a hardcoded constant in
# src/juniper_math/dataset/* — that code reads this file. Changing any field
# here and rebuilding produces a NEW dataset version; it never mutates a
# frozen v1 shard set in place (Sec. 5 of the Phase 4 instructions).
#
# Scope decision (documented, conservative): this dataset is 100% synthetic,
# deterministically generated by project-controlled Python generators. No
# third-party corpus is acquired for v1. Rationale: Phase 4 Sec. 11 warns
# against including external data "merely because everyone else trains on
# it", and independently establishing redistribution rights for a
# third-party math corpus is a legal-judgment call this engineering session
# is not positioned to make responsibly. External sources remain a
# documented option for a future dataset_version, not a v1 requirement.
# See reports/PHASE4_PROVENANCE_LICENSE_REVIEW.md.

dataset_id: "juniper-math-dataset-v1"
dataset_schema_version: "1.0.0"

# Root seed all per-example seeds derive from (never Python's random module
# global state, never PYTHONHASHSEED-dependent hash()) — see
# src/juniper_math/dataset/idgen.py. Distinct from the Phase 2 tokenizer
# corpus seed (20260201) so the two corpora are independently reproducible.
master_seed: 20260401

# Identity of the frozen artifacts this dataset is built against. A dataset
# built against a different tokenizer or protocol identity is a different
# dataset — these are recorded, not re-derived, so `dataset validate` can
# fail loudly on drift rather than silently counting tokens against the
# wrong vocabulary.
tokenizer_identity: "juniper-math-tokenizer-v1"
tool_protocol_identity: "juniper-tool-protocol-v1"
tool_protocol_version: "1.0.0"

# Working token-count envelope (Sec. 18). Not a quota: `dataset build` stops
# each split once its target is reached, and generation is explicitly capped
# per-family (anti-template-collapse, Sec. 17) so the envelope cannot be hit
# by over-repeating a single cheap template.
token_budget:
  envelope_min: 50_000_000
  envelope_max: 100_000_000
  target: 70_000_000
  max_example_tokens: 1024 # matches config/architecture.yaml max_context_length

# Category mixture: target proportion of the TRAIN split's example count
# per top-level category. Must sum to 1.0 (validated). Difficulty and
# synthetic/tool-required mixture are properties of each category's own
# generator, not re-specified here, to avoid two sources of truth.
# ambiguity/missing_information/undefined_operation/unsupported_capability
# are deliberately small shares: each is built from a handful of curated,
# construction-verified template families (Sec. 10) with inherently bounded
# combinatorial diversity (a handful of names/ratios/small integers) — an
# early build showed these four plateau on exact-duplicate space long before
# a proportional share of the token envelope, which is exactly the Sec. 18
# "don't force size past a quality plateau" signal, not a bug to work around
# by inflating their operand ranges into unnatural territory.
category_mixture:
  arithmetic: 0.132
  operator_precedence: 0.05
  negative_values: 0.03
  decimals: 0.04
  fractions: 0.04
  percentages: 0.05
  ratios_proportions: 0.04
  scientific_notation: 0.03
  unit_conversion: 0.07
  financial_math: 0.07
  basic_algebra: 0.05
  expression_translation: 0.03
  word_problem: 0.072
  estimation: 0.03
  numerical_comparison: 0.03
  multi_step: 0.062
  tool_use: 0.078
  incorrect_supplied_answer: 0.04
  incorrect_tool_call: 0.02
  ambiguity: 0.008
  missing_information: 0.008
  undefined_operation: 0.008
  unsupported_capability: 0.008
  tool_error: 0.004

# Anti-template-collapse controls (Sec. 17). No single template_id may exceed
# this fraction of its family's examples, and no single family may exceed
# this fraction of the whole corpus.
# max_template_share_within_family is intentionally not set low enough to
# force perfect uniformity across an arbitrary number of templates: several
# families have only 2-3 phrasing templates by design (Sec. 8 explicitly
# warns against inflating template counts with meaningless wording churn),
# and a cap below (1 / template_count) for any real family would make
# convergence mathematically impossible. 0.60 still blocks the failure mode
# Sec. 17 actually targets — one template silently swallowing a family.
diversity_caps:
  max_template_share_within_family: 0.60
  max_family_share_of_corpus: 0.12

# Split strategy (Sec. 14): grouping key is (generator_id, family_id,
# derivation_id) — never the rendered prompt text and never a random row
# shuffle. All examples sharing a derivation_id are assigned to the same
# split. Split assignment is a deterministic function of
# sha256(master_seed, generator_id, family_id, derivation_id), never
# Python's random module, so it reproduces identically across machines.
split:
  train: 0.90
  validation: 0.05
  test: 0.05
  # Reserved seed-range offsets so eval-suite generation draws from a
  # namespace that can never collide with a train/validation/test
  # derivation_id, independent of the contamination checker (defense in
  # depth — Sec. 13).
  eval_suite_seed_offset: 900_000_000_000

# Deduplication (Sec. 16).
dedup:
  exact_key: "normalized_prompt+normalized_expected_answer"
  near_duplicate_method: "shingled_jaccard"
  near_duplicate_shingle_size: 5
  near_duplicate_jaccard_threshold: 0.92

# Cleaning / normalization (Sec. 15). Mathematical Unicode is explicitly
# preserved, never folded to ASCII.
normalization:
  unicode_form: "NFC"
  collapse_repeated_whitespace: true
  strip_surrounding_whitespace: true
  preserve_math_unicode: ["−", "×", "÷", "π", "√", "≤", "≥", "≈", "°"]
  reject_control_characters: true

# Shard format (Sec. 21).
shard:
  format: "jsonl"
  records_per_shard: 50_000
  filename_pattern: "juniper-math-dataset-v1.{split}.{shard_index:05d}.jsonl"

output:
  processed_dir: "data/processed/juniper-math-dataset-v1"
  manifest_file: "data/processed/juniper-math-dataset-v1/shard_manifest.json"
  stats_file: "data/processed/juniper-math-dataset-v1/stats.json"
  dataset_identity_file: "data/processed/juniper-math-dataset-v1/DATASET_IDENTITY.sha256"
