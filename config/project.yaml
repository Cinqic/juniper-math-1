    - "the corrected run still regresses unmasked full-corpus validation loss by 12.5%-30.7% depending on checkpoint, exceeding the pre-committed 0.05-absolute-nat tolerance"
    - "at a larger (n=200) evaluation sample, several tool-format metrics (tool_use_format.valid_rate, argument_execution_successful, terminal_tag_correct) are measurably WORSE on every SFT candidate than on the Base"
    - "no checkpoint (including the Base) achieves nonzero end_to_end_success_on_tool_required or direct_answer_correct on the held-out suite"
    - "the original Phase 8 result was an honest marginal, mixed outcome rather than a demonstrated capability improvement; later recovery evidence is indexed separately"
