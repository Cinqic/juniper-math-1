[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "juniper-math-1"
version = "0.1.0"
description = "A purpose-built ~5M-parameter mathematical language model: understanding, decomposing, tool-using, and verifying math problems."
readme = "README.md"
# Narrowed from ">=3.10,<3.13" during Opus 5 Phase 0 remediation. 3.10 and 3.11
# were declared but never tested (review NOTE-A), and the validated dependency
# set does not support them: numpy 2.5.2 requires >=3.12, so an install on 3.10
# or 3.11 silently resolves a materially different environment. Declared support
# now equals tested support. Widening requires adding the interpreter to CI first.
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Cinqic" }]
dependencies = [
    "torch>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=1.26,<3.0",
    "sentencepiece>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.10,<2.0",
    # Used only by Terra's raw SentencePiece ModelProto audit test. SentencePiece
    # itself remains the sole runtime tokenizer dependency.
    "protobuf>=6.0,<7.0",
    "types-PyYAML>=6.0,<7.0",
    # Phase 2 general-purpose tokenizer baseline (Sec. 55-56 of the Phase 2
    # instructions). Informational comparison only — not used at runtime by
    # any project code path, so it lives in dev, not the runtime dependency
    # set. See scripts/tokenizer_benchmark.py.
    "tiktoken>=0.7,<1.0",
]

[project.scripts]
juniper-math = "juniper_math.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: requires a CUDA-capable GPU (skipped automatically when unavailable)",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["src"]
